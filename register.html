<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VideoBelajar - Create Account</title>
<meta name="description" content="Register for MasjidCare Mosque Management System">
<link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@100..900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" onload="window.lucideLoaded=true; if(window.initLucide) window.initLucide();"></script>
<script>
  window.initLucide = function() { if(window.lucide) lucide.createIcons(); };
  document.addEventListener('DOMContentLoaded', function() { if(window.lucideLoaded) window.initLucide(); });
</script>
<style type="text/tailwindcss">
  :root {
    --primary: #165DFF;
    --primary-hover: #0E4BD9;
    --foreground: #080C1A;
    --secondary: #6A7686;
    --muted: #EFF2F7;
    --border: #F3F4F3;
    --card-grey: #F1F3F6;
    --card-message: #C9E6FC;
    --success: #30B22D;
    --success-light: #DCFCE7;
    --error: #ED6B60;
    --error-light: #FEE2E2;
    --warning: #FED71F;
    --font-sans: 'Lexend Deca', sans-serif;
  }
  @theme inline {
    --color-primary: var(--primary);
    --color-primary-hover: var(--primary-hover);
    --color-foreground: var(--foreground);
    --color-secondary: var(--secondary);
    --color-muted: var(--muted);
    --color-border: var(--border);
    --color-card-grey: var(--card-grey);
    --color-card-message: var(--card-message);
    --color-success: var(--success);
    --color-success-light: var(--success-light);
    --color-error: var(--error);
    --color-error-light: var(--error-light);
    --color-warning: var(--warning);
    --font-sans: var(--font-sans);
  }
  
  /* Custom Checkbox Styles */
  .custom-checkbox input:checked + div {
    background-color: var(--primary);
    border-color: var(--primary);
  }
  .custom-checkbox input:checked + div svg {
    opacity: 1;
  }
</style>
</head>
<body class="font-sans bg-white min-h-screen text-foreground antialiased selection:bg-primary/20 selection:text-primary">

<!-- Toast Notification Container -->
<div id="toast-container" class="fixed top-6 left-1/2 -translate-x-1/2 z-[100] flex flex-col gap-2 pointer-events-none"></div>

<div class="flex min-h-screen w-full">
  
  <!-- LEFT PANEL: Form -->
  <div class="flex-1 flex flex-col justify-center px-6 py-10 sm:px-12 lg:flex-none lg:w-1/2 xl:px-24 bg-white relative z-10">
    <div class="mx-auto w-full max-w-sm lg:max-w-md">
      
      <!-- Logo & Branding -->
      <div class="flex items-center gap-3 mb-8">
        <div class="w-12 h-12 bg-primary rounded-2xl flex items-center justify-center shadow-lg shadow-primary/20">
          <i data-lucide="graduation-cap" class="w-6 h-6 text-white"></i>
        </div>
        <span class="font-bold text-2xl tracking-tight">VideoBelajar</span>
      </div>

      <!-- Headings -->
      <div class="mb-8">
        <h1 class="text-[32px] leading-tight font-bold text-foreground mb-2">Create Account</h1>
        <p class="text-secondary font-medium text-lg">Mosque Islamic Management System</p>
      </div>

      <!-- Register Form -->
      <form onsubmit="handleRegister(event)" class="space-y-4">
        
        <!-- Full Name Input (Floating Label) -->
        <div class="relative h-[72px] rounded-3xl ring-1 ring-border focus-within:ring-2 focus-within:ring-primary transition-all duration-300 bg-white group">
          <i data-lucide="user" class="absolute left-6 top-1/2 size-6 shrink-0 -translate-y-1/2 text-secondary group-focus-within:text-primary transition-colors"></i>
          <div class="w-[1.5px] h-6 bg-border absolute left-16 top-1/2 -translate-y-1/2 group-focus-within:bg-primary/30 transition-colors"></div>
          <input 
            id="inputName" 
            type="text" 
            required 
            class="peer absolute inset-0 w-full h-full bg-transparent font-semibold focus:outline-none pb-4 pl-20 pr-6 pt-9 text-foreground" 
            placeholder=" "
          >
          <label 
            for="inputName" 
            class="absolute left-20 text-secondary text-sm font-medium transition-all duration-300 peer-placeholder-shown:top-1/2 peer-placeholder-shown:-translate-y-1/2 top-4 peer-focus:top-4 -translate-y-0 peer-focus:-translate-y-0 cursor-text"
          >
            Full Name
          </label>
        </div>

        <!-- Mosque / Organization Input (Floating Label) -->
        <div class="relative h-[72px] rounded-3xl ring-1 ring-border focus-within:ring-2 focus-within:ring-primary transition-all duration-300 bg-white group">
          <i data-lucide="phone" class="absolute left-6 top-1/2 size-6 shrink-0 -translate-y-1/2 text-secondary group-focus-within:text-primary transition-colors"></i>
          <div class="w-[1.5px] h-6 bg-border absolute left-16 top-1/2 -translate-y-1/2 group-focus-within:bg-primary/30 transition-colors"></div>
          <input 
            id="inputMosque" 
            type="text" 
            required 
            class="peer absolute inset-0 w-full h-full bg-transparent font-semibold focus:outline-none pb-4 pl-20 pr-6 pt-9 text-foreground" 
            placeholder=" "
          >
          <label 
            for="inputMosque" 
            class="absolute left-20 text-secondary text-sm font-medium transition-all duration-300 peer-placeholder-shown:top-1/2 peer-placeholder-shown:-translate-y-1/2 top-4 peer-focus:top-4 -translate-y-0 peer-focus:-translate-y-0 cursor-text"
          >
            Phone Number
          </label>
        </div>

        <!-- Email Input (Floating Label) -->
        <div class="relative h-[72px] rounded-3xl ring-1 ring-border focus-within:ring-2 focus-within:ring-primary transition-all duration-300 bg-white group">
          <i data-lucide="mail" class="absolute left-6 top-1/2 size-6 shrink-0 -translate-y-1/2 text-secondary group-focus-within:text-primary transition-colors"></i>
          <div class="w-[1.5px] h-6 bg-border absolute left-16 top-1/2 -translate-y-1/2 group-focus-within:bg-primary/30 transition-colors"></div>
          <input 
            id="inputEmail" 
            type="email" 
            required 
            class="peer absolute inset-0 w-full h-full bg-transparent font-semibold focus:outline-none pb-4 pl-20 pr-6 pt-9 text-foreground" 
            placeholder=" "
          >
          <label 
            for="inputEmail" 
            class="absolute left-20 text-secondary text-sm font-medium transition-all duration-300 peer-placeholder-shown:top-1/2 peer-placeholder-shown:-translate-y-1/2 top-4 peer-focus:top-4 -translate-y-0 peer-focus:-translate-y-0 cursor-text"
          >
            Email Address
          </label>
        </div>

        <!-- Password Input (Floating Label + Toggle) -->
        <div class="relative h-[72px] rounded-3xl ring-1 ring-border focus-within:ring-2 focus-within:ring-primary transition-all duration-300 bg-white group">
          <i data-lucide="lock" class="absolute left-6 top-1/2 size-6 shrink-0 -translate-y-1/2 text-secondary group-focus-within:text-primary transition-colors"></i>
          <div class="w-[1.5px] h-6 bg-border absolute left-16 top-1/2 -translate-y-1/2 group-focus-within:bg-primary/30 transition-colors"></div>
          <input 
            id="inputPassword" 
            type="password" 
            required 
            minlength="8"
            class="peer absolute inset-0 w-full h-full bg-transparent font-semibold focus:outline-none pb-4 pl-20 pr-16 pt-9 text-foreground" 
            placeholder=" "
          >
          <label 
            for="inputPassword" 
            class="absolute left-20 text-secondary text-sm font-medium transition-all duration-300 peer-placeholder-shown:top-1/2 peer-placeholder-shown:-translate-y-1/2 top-4 peer-focus:top-4 -translate-y-0 peer-focus:-translate-y-0 cursor-text"
          >
            Password (min. 8 characters)
          </label>
          <button 
            type="button" 
            onclick="togglePassword('inputPassword', 'eyeIconPassword')" 
            class="absolute right-6 top-1/2 -translate-y-1/2 text-secondary hover:text-foreground transition-colors cursor-pointer p-1 rounded-lg hover:bg-muted"
            aria-label="Toggle password visibility"
          >
            <i data-lucide="eye" id="eyeIconPassword" class="size-5"></i>
          </button>
        </div>

        <!-- Confirm Password Input (Floating Label + Toggle) -->
        <div class="relative h-[72px] rounded-3xl ring-1 ring-border focus-within:ring-2 focus-within:ring-primary transition-all duration-300 bg-white group">
          <i data-lucide="shield-check" class="absolute left-6 top-1/2 size-6 shrink-0 -translate-y-1/2 text-secondary group-focus-within:text-primary transition-colors"></i>
          <div class="w-[1.5px] h-6 bg-border absolute left-16 top-1/2 -translate-y-1/2 group-focus-within:bg-primary/30 transition-colors"></div>
          <input 
            id="inputConfirmPassword" 
            type="password" 
            required 
            class="peer absolute inset-0 w-full h-full bg-transparent font-semibold focus:outline-none pb-4 pl-20 pr-16 pt-9 text-foreground" 
            placeholder=" "
          >
          <label 
            for="inputConfirmPassword" 
            class="absolute left-20 text-secondary text-sm font-medium transition-all duration-300 peer-placeholder-shown:top-1/2 peer-placeholder-shown:-translate-y-1/2 top-4 peer-focus:top-4 -translate-y-0 peer-focus:-translate-y-0 cursor-text"
          >
            Confirm Password
          </label>
          <button 
            type="button" 
            onclick="togglePassword('inputConfirmPassword', 'eyeIconConfirm')" 
            class="absolute right-6 top-1/2 -translate-y-1/2 text-secondary hover:text-foreground transition-colors cursor-pointer p-1 rounded-lg hover:bg-muted"
            aria-label="Toggle confirm password visibility"
          >
            <i data-lucide="eye" id="eyeIconConfirm" class="size-5"></i>
          </button>
        </div>

        <!-- Terms Agreement Row -->
        <div class="pt-2 pb-2">
          <label class="custom-checkbox flex items-start gap-3 cursor-pointer group select-none">
            <div class="relative mt-0.5">
              <input type="checkbox" id="agreeTerms" required class="sr-only">
              <div class="w-5 h-5 rounded-md border-2 border-secondary/30 group-hover:border-primary transition-colors flex items-center justify-center bg-white">
                <i data-lucide="check" class="size-3.5 text-white opacity-0 transition-opacity"></i>
              </div>
            </div>
            <span class="text-sm font-medium text-secondary group-hover:text-foreground transition-colors leading-relaxed">
              I agree to the <a href="#" class="text-primary font-semibold hover:underline">Terms of Service</a> and <a href="#" class="text-primary font-semibold hover:underline">Privacy Policy</a>
            </span>
          </label>
        </div>

        <!-- Submit Button -->
        <button 
          type="submit" 
          class="w-full h-[64px] rounded-full bg-primary text-white font-bold text-lg hover:bg-primary-hover transition-all duration-300 cursor-pointer shadow-[0_8px_20px_-6px_rgba(22,93,255,0.4)] hover:shadow-[0_12px_24px_-8px_rgba(22,93,255,0.6)] hover:-translate-y-0.5 flex items-center justify-center gap-2 group mt-2"
        >
          <span>Create Account</span>
          <i data-lucide="arrow-right" class="size-5 group-hover:translate-x-1 transition-transform"></i>
        </button>

        <!-- Divider -->
        <div class="relative flex items-center justify-center my-6">
          <div class="w-full border-t border-border"></div>
          <span class="absolute px-4 bg-white text-xs uppercase tracking-wider font-semibold text-secondary">or</span>
        </div>

        <!-- Google Register Button -->
        <a href="home.html"
          class="w-full h-[64px] rounded-full border border-border hover:border-secondary/40 bg-white hover:bg-slate-50 text-foreground font-semibold text-base transition-all duration-300 shadow-sm hover:shadow hover:-translate-y-0.5 flex items-center justify-center gap-3 cursor-pointer group"
        >
          <svg class="size-5 shrink-0" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          <span>Sign up with Google</span>
        </a>
      </form>
      
      <!-- Footer Links -->
      <div class="mt-8 text-center space-y-2">
        <p class="text-sm font-medium text-secondary">
          Already have an account? <a href="login.html" class="text-primary font-semibold hover:underline cursor-pointer">Sign In</a>
        </p>
        <p class="text-xs font-medium text-secondary/70">
          Need assistance? <a href="#" class="text-primary hover:underline cursor-pointer">Contact Support</a>
        </p>
      </div>

    </div>
  </div>

  <!-- RIGHT PANEL: Image & Card -->
  <div class="hidden lg:block relative w-1/2 bg-foreground overflow-hidden">
    <!-- Background Image -->
    <img 
      class="absolute inset-0 h-full w-full object-cover opacity-90" 
      src="https://images.unsplash.com/photo-1519452575417-564c1401ecc0?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTh8fGVkdWNhdGlvbnxlbnwwfHwwfHx8Mg%3D%3D" 
      alt="Magnificent Mosque Dome and Architecture"
    >
    
    <!-- Subtle Gradient Overlay for depth -->
    <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-black/10 to-transparent"></div>

    <!-- Floating Review/Stat Card -->
    <div class="absolute bottom-16 left-12 right-12 xl:left-24 xl:right-24">
      <div class="bg-white/95 backdrop-blur-xl rounded-[32px] p-8 flex items-center gap-6 shadow-[0_32px_64px_-12px_rgba(0,0,0,0.3)] border border-white/20 transform transition-transform hover:-translate-y-2 duration-500">
        <div class="size-20 rounded-2xl bg-primary/10 flex items-center justify-center shrink-0 ring-1 ring-primary/20">
          <i data-lucide="users" class="size-10 text-primary"></i>
        </div>
        <div class="flex flex-col gap-1">
          <p class="text-secondary font-semibold uppercase tracking-wider text-sm">Community Trust</p>
          <h3 class="text-[40px] leading-none font-bold text-foreground tracking-tight">1,200+</h3>
          <div class="flex items-center gap-2 mt-1">
            <span class="flex size-2 rounded-full bg-success"></span>
            <p class="text-base font-semibold text-success">Happy members with us</p>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>

<!-- Page Not Found Modal (for dummy links) -->
<div id="page-not-found-modal" class="fixed inset-0 bg-black/50 z-[200] hidden flex items-center justify-center p-4 opacity-0 transition-opacity duration-300">
  <div class="bg-white rounded-3xl p-8 max-w-sm w-full text-center transform scale-95 transition-transform duration-300 shadow-2xl">
    <div class="w-20 h-20 bg-muted rounded-full flex items-center justify-center mx-auto mb-5">
      <i data-lucide="link" class="w-10 h-10 text-secondary"></i>
    </div>
    <h3 class="text-foreground text-2xl font-bold mb-2">Link Clicked</h3>
    <p class="text-secondary font-medium mb-8">This is a demo page. Links are placeholders.</p>
    <button onclick="closeModal()" class="w-full h-14 bg-primary text-white rounded-full font-bold text-lg hover:bg-primary-hover transition-all duration-300 cursor-pointer">
      Got it
    </button>
  </div>
</div>

<script>
  // Initialize Lucide icons
  document.addEventListener('DOMContentLoaded', function() {
    if(window.lucide) lucide.createIcons();
    
    // Add click handlers to all dummy links
    document.querySelectorAll('a[href="#"]').forEach(link => {
      link.addEventListener('click', function(e) {
        e.preventDefault();
        showModal();
      });
    });
  });

  // Toggle Password Visibility
  function togglePassword(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon = document.getElementById(iconId);
    
    if (input.type === 'password') {
      input.type = 'text';
      icon.setAttribute('data-lucide', 'eye-off');
    } else {
      input.type = 'password';
      icon.setAttribute('data-lucide', 'eye');
    }
    lucide.createIcons();
  }

  // Handle Register Form Submission
  function handleRegister(event) {
    event.preventDefault();
    const name = document.getElementById('inputName').value.trim();
    const mosque = document.getElementById('inputMosque').value.trim();
    const email = document.getElementById('inputEmail').value.trim();
    const password = document.getElementById('inputPassword').value;
    const confirmPassword = document.getElementById('inputConfirmPassword').value;
    const agree = document.getElementById('agreeTerms').checked;

    // Check passwords match
    if (password !== confirmPassword) {
      showToast('Passwords do not match. Please check again.', 'error');
      return;
    }

    if (!agree) {
      showToast('Please agree to the Terms of Service & Privacy Policy.', 'error');
      return;
    }

    const btn = event.target.querySelector('button[type="submit"]');
    const originalContent = btn.innerHTML;
    
    // Simulate loading state
    btn.innerHTML = '<i data-lucide="loader-2" class="size-6 animate-spin"></i>';
    lucide.createIcons();
    btn.disabled = true;
    btn.classList.add('opacity-80', 'cursor-not-allowed');

    // Simulate API call
    setTimeout(() => {
      btn.innerHTML = originalContent;
      btn.disabled = false;
      btn.classList.remove('opacity-80', 'cursor-not-allowed');
      lucide.createIcons();
      
      showToast(`Account created successfully! Welcome, ${name}.`, 'success');
      
      // Optional redirect to login after short delay
      setTimeout(() => {
        window.location.href = 'home.html';
      }, 1800);
    }, 1500);
  }

  // Toast Notification System
  function showToast(message, type = 'success') {
    const container = document.getElementById('toast-container');
    const toast = document.createElement('div');
    
    const isSuccess = type === 'success';
    const bgColor = isSuccess ? 'bg-success-light' : 'bg-red-50';
    const textColor = isSuccess ? 'text-green-800' : 'text-red-800';
    const iconColor = isSuccess ? 'text-success' : 'text-error';
    const iconName = isSuccess ? 'check-circle' : 'alert-circle';
    const borderColor = isSuccess ? 'border-success/20' : 'border-error/20';

    toast.className = `flex items-center gap-3 px-6 py-4 rounded-2xl ${bgColor} border ${borderColor} shadow-lg transform transition-all duration-300 translate-y-[-100%] opacity-0`;
    
    toast.innerHTML = `
      <i data-lucide="${iconName}" class="size-6 ${iconColor}"></i>
      <p class="font-semibold ${textColor}">${message}</p>
    `;
    
    container.appendChild(toast);
    lucide.createIcons();
    
    // Animate in
    requestAnimationFrame(() => {
      toast.classList.remove('translate-y-[-100%]', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');
    });
    
    // Remove after 3.5 seconds
    setTimeout(() => {
      toast.classList.remove('translate-y-0', 'opacity-100');
      toast.classList.add('translate-y-[-100%]', 'opacity-0');
      setTimeout(() => toast.remove(), 300);
    }, 3500);
  }

  // Modal Functions
  function showModal() {
    const modal = document.getElementById('page-not-found-modal');
    const content = modal.querySelector('div');
    modal.classList.remove('hidden');
    
    // Trigger reflow
    void modal.offsetWidth;
    
    modal.classList.remove('opacity-0');
    content.classList.remove('scale-95');
    content.classList.add('scale-100');
  }

  function closeModal() {
    const modal = document.getElementById('page-not-found-modal');
    const content = modal.querySelector('div');
    
    modal.classList.add('opacity-0');
    content.classList.remove('scale-100');
    content.classList.add('scale-95');
    
    setTimeout(() => {
      modal.classList.add('hidden');
    }, 300);
  }
</script>
</body>
</html>
